spring.profiles.active=test

# JWT
jwt.public.key=classpath:jwt.public.key
jwt.issuer=http://localhost:8080

# Datasource
spring.datasource.url=jdbc:h2:mem:oficina_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=false

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT interno
jwt.servico.public.key=classpath:jwt.public.key

# Mensageria desligada: os ITs de broker ligam por @DynamicPropertySource
app.mensageria.habilitada=false
app.mensageria.fila-comandos=oficina-execucao-comandos
app.mensageria.fila-eventos=oficina-os-saga-eventos
spring.cloud.aws.sqs.enabled=false
spring.cloud.aws.region.static=us-east-1
